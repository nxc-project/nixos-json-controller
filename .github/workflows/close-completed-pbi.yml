name: Close completed PBI

on:
  issues:
    types: [closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Process close events serially. A later close event re-checks the current
# state of the parent's full child list, avoiding races between sibling Issues.
concurrency:
  group: pbi-completion-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  close-completed-pbi:
    name: Close PBI when every child is complete
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false

      - name: Check and close completed PBI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { handleClosure } = require("./.github/scripts/close-completed-pbi.js");
            await handleClosure({ github, context, core });
