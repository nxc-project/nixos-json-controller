name: Update App Store recommendations

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-recommendations.yml"
      - "frontend/scripts/update-recommendations.mjs"
      - "frontend/scripts/recommendation-package-map.json"

# Serialize updates so a manual run cannot race with the scheduled publication.
concurrency:
  group: update-recommendations
  cancel-in-progress: false

jobs:
  update-recommendations:
    permissions:
      contents: write
    name: Publish Arch pkgstats recommendation data
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare the previous Release snapshot
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/nxc-recommendations"
          data_file="$data_dir/recommendations.json"
          mkdir -p "$data_dir"

          if gh release view recommendations-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Use the rolling Release as the comparison baseline when its JSON is available.
            if gh release download recommendations-latest \
              --repo "$GITHUB_REPOSITORY" \
              --pattern recommendations.json \
              --dir "$data_dir"; then
              echo "has_release=true" >> "$GITHUB_OUTPUT"
            else
              # A Release can exist while its asset is missing (for example, if
              # an upload was interrupted). Recover from the bundled fallback.
              echo "Rolling Release asset unavailable; recovering from bundled fallback." >&2
              rm -f "$data_file"
              cp frontend/public/data/recommendations.json "$data_file"
              echo "has_release=false" >> "$GITHUB_OUTPUT"
            fi
          else
            cp frontend/public/data/recommendations.json "$data_file"
            echo "has_release=false" >> "$GITHUB_OUTPUT"
          fi

          echo "output_file=$data_file" >> "$GITHUB_OUTPUT"
          previous_hash="$(sha256sum "$data_file" | cut -d ' ' -f 1)"
          echo "previous_hash=$previous_hash" >> "$GITHUB_OUTPUT"

      - name: Generate recommendation data
        id: generate
        env:
          NXC_RECOMMENDATIONS_OUTPUT: ${{ steps.prepare.outputs.output_file }}
        shell: bash
        run: |
          set -euo pipefail
          node frontend/scripts/update-recommendations.mjs
          current_hash="$(sha256sum "$NXC_RECOMMENDATIONS_OUTPUT" | cut -d ' ' -f 1)"
          echo "current_hash=$current_hash" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: metadata
        env:
          DATA_FILE: ${{ steps.prepare.outputs.output_file }}
        shell: bash
        run: |
          set -euo pipefail
          generated_at="$(node -e 'const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(d.generatedAt ?? "unknown")' "$DATA_FILE")"
          period="$(node -e 'const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); console.log(d.period ? `${d.period.startMonth}-${d.period.endMonth}` : "unknown")' "$DATA_FILE")"
          checksum="$(sha256sum "$DATA_FILE" | cut -d ' ' -f 1)"
          checksum_file="$RUNNER_TEMP/recommendations.json.sha256"
          printf '%s  recommendations.json\n' "$checksum" > "$checksum_file"
          notes="$RUNNER_TEMP/nxc-recommendation-release-notes.md"

          cat > "$notes" <<EOF
          Machine-generated recommendation dataset for NXC LOUNGE.

          - Source: https://pkgstats.archlinux.de/api/doc
          - Statistics period: $period
          - Generated at: $generated_at
          - Artifact: recommendations.json
          - SHA-256: $checksum

          The upstream API documentation reviewed by this project did not specify an explicit redistribution license for the statistics payload. Publishing this artifact does not establish or grant rights to the upstream data. See THIRD_PARTY_NOTICES.md in the source repository for the current review status.
          EOF

          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes" >> "$GITHUB_OUTPUT"

      - name: Check rolling Release integrity
        id: integrity
        env:
          DATA_FILE: ${{ steps.prepare.outputs.output_file }}
          CHECKSUM_FILE: ${{ steps.metadata.outputs.checksum_file }}
          NOTES_FILE: ${{ steps.metadata.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          rolling_dir="$RUNNER_TEMP/nxc-rolling-integrity"
          mkdir -p "$rolling_dir"
          rm -f "$rolling_dir/recommendations.json" "$rolling_dir/recommendations.json.sha256"

          needs_update=false
          if ! gh release view recommendations-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            needs_update=true
          else
            remote_data_ok=false
            if gh release download recommendations-latest \
              --repo "$GITHUB_REPOSITORY" \
              --pattern recommendations.json \
              --dir "$rolling_dir" >/dev/null 2>&1; then
              remote_hash="$(sha256sum "$rolling_dir/recommendations.json" | cut -d ' ' -f 1)"
              expected_hash="$(sha256sum "$DATA_FILE" | cut -d ' ' -f 1)"
              [[ "$remote_hash" == "$expected_hash" ]] && remote_data_ok=true
            fi

            remote_checksum_ok=false
            if gh release download recommendations-latest \
              --repo "$GITHUB_REPOSITORY" \
              --pattern recommendations.json.sha256 \
              --dir "$rolling_dir" >/dev/null 2>&1; then
              if cmp -s "$rolling_dir/recommendations.json.sha256" "$CHECKSUM_FILE"; then
                remote_checksum_ok=true
              fi
            fi

            expected_notes="$(cat "$NOTES_FILE")"
            current_notes="$(gh release view recommendations-latest --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' 2>/dev/null || true)"
            notes_ok=false
            [[ "$current_notes" == "$expected_notes" ]] && notes_ok=true

            if [[ "$remote_data_ok" != true || "$remote_checksum_ok" != true || "$notes_ok" != true ]]; then
              needs_update=true
              echo "Rolling Release integrity check detected stale or missing data, checksum, or notes."
            fi
          fi

          echo "needs_update=$needs_update" >> "$GITHUB_OUTPUT"

      - name: Publish a versioned snapshot
        if: steps.prepare.outputs.has_release != 'true' || steps.prepare.outputs.previous_hash != steps.generate.outputs.current_hash
        env:
          DATA_FILE: ${{ steps.prepare.outputs.output_file }}
          CHECKSUM_FILE: ${{ steps.metadata.outputs.checksum_file }}
          NOTES_FILE: ${{ steps.metadata.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          tag="recommendations-$(date -u +'%Y%m%dT%H%M%SZ')-$GITHUB_RUN_ID"
          gh release create "$tag" "$DATA_FILE" "$CHECKSUM_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NXC recommendation dataset $tag" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest=false

      - name: Repair rolling Release assets and notes
        if: steps.prepare.outputs.has_release != 'true' || steps.prepare.outputs.previous_hash != steps.generate.outputs.current_hash || steps.integrity.outputs.needs_update == 'true'
        env:
          DATA_FILE: ${{ steps.prepare.outputs.output_file }}
          CHECKSUM_FILE: ${{ steps.metadata.outputs.checksum_file }}
          NOTES_FILE: ${{ steps.metadata.outputs.notes_file }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view recommendations-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Upload each asset explicitly. If one upload fails midway, the next
            # run detects the incomplete pair and repairs both assets and notes.
            gh release upload recommendations-latest "$DATA_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release upload recommendations-latest "$CHECKSUM_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit recommendations-latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "NXC recommendation dataset (rolling latest)" \
              --notes-file "$NOTES_FILE"
          else
            gh release create recommendations-latest "$DATA_FILE" "$CHECKSUM_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NXC recommendation dataset (rolling latest)" \
              --notes-file "$NOTES_FILE" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      - name: Report unchanged dataset
        if: steps.prepare.outputs.has_release == 'true' && steps.prepare.outputs.previous_hash == steps.generate.outputs.current_hash && steps.integrity.outputs.needs_update != 'true'
        run: echo "Recommendation data and rolling Release metadata are unchanged."
