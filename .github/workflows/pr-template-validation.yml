name: PR template validation

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - edited
      - reopened
      - ready_for_review

jobs:
  validate-pr-template:
    name: PR template sections
    runs-on: ubuntu-latest

    steps:
      - name: Check out the PR code for validator tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      - name: Check out the base-branch PR template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test PR template validator
        run: node --test pr/.github/scripts/validate-pr-template.test.js

      - name: Test completed-PBI closure logic
        run: node --test pr/.github/scripts/close-completed-pbi.test.js

      - name: Validate PR body against the base-branch template
        run: node pr/.github/scripts/validate-pr-template.js "$GITHUB_EVENT_PATH" base/.github/pull_request_template.md
